<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevManager · Proyectos, talento y documentos para el sector solidario</title>
    <meta name="description" content="Gestión de proyectos, talento humano y control documental para cooperativas, fondos de empleados y mutuales." />
    <!-- App icons: generated from public/favicon.svg, see docs/identidad-visual.md. Vite prefixes these paths with base. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b6fb8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111b22" media="(prefers-color-scheme: dark)" />
    <!-- Apply the saved theme before first paint (same key and rules as useTheme). -->
    <script>
        try {
            var t = localStorage.getItem('theme');
            var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased min-h-screen selection:bg-primary-600 selection:text-white">
    <div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
